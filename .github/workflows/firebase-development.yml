name: Deploy isolated development Firebase

on:
  push:
    branches: [main]
    paths:
      - lib/**
      - assets/**
      - web/**
      - config/brand.json
      - pubspec.yaml
      - pubspec.lock
      - .fvmrc
      - functions/src/**
      - functions/certificates/**
      - functions/package*.json
      - functions-legacy/src/**
      - functions-legacy/package*.json
      - functions-legacy/tsconfig.json
      - firebase.development.json
      - tool/firebase/environments.mjs
      - tool/firebase/prepare-development-display.mjs
      - firestore.rules
      - firestore.indexes.json
      - database.rules.json
      - storage.rules
  workflow_dispatch:
    inputs:
      scope:
        description: Development-only retry scope (no production resources)
        type: choice
        default: full
        options: [full, web, backend, rules]

permissions:
  contents: read
  actions: read

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.plan.outputs.web }}
      backend: ${{ steps.plan.outputs.backend }}
      rules: ${{ steps.plan.outputs.rules }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tool/firebase/development-plan.mjs
      - name: Verify development and production identities are separate
        run: node tool/firebase/environments.mjs check

  build_web:
    needs: plan
    if: needs.plan.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build and stamp development web
        run: node tool/firebase/environments.mjs build development
      - uses: actions/upload-artifact@v4
        with:
          name: development-web-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/web/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy_backend:
    needs: plan
    if: needs.plan.outputs.backend == 'true' || needs.plan.outputs.rules == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: firebase-development
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json
            functions-legacy/package-lock.json
      - run: npm ci --prefix functions
      - name: Install the existing display output callable dependencies
        if: needs.plan.outputs.backend == 'true'
        run: npm ci --prefix functions-legacy
      - name: Confirm latest development source
        run: node tool/firebase/development-plan.mjs current
      - name: Authenticate only to development
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1339501332/locations/global/workloadIdentityPools/github-development/providers/github
          service_account: github-development@cloud-board-development.iam.gserviceaccount.com
      - name: Deploy development compatibility backend
        if: needs.plan.outputs.backend == 'true'
        run: |
          node tool/firebase/development-plan.mjs current
          node tool/firebase/environments.mjs deploy development backend
      - name: Deploy development rules
        if: needs.plan.outputs.rules == 'true'
        run: |
          node tool/firebase/development-plan.mjs current
          node tool/firebase/environments.mjs deploy development rules

  deploy_web:
    needs: [plan, build_web, deploy_backend]
    if: >-
      always() && !cancelled() && needs.build_web.result == 'success' &&
      (needs.deploy_backend.result == 'success' || needs.deploy_backend.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: firebase-development
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: development-web-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/web
      - name: Confirm latest development source
        run: node tool/firebase/development-plan.mjs current
      - name: Authenticate only to development
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1339501332/locations/global/workloadIdentityPools/github-development/providers/github
          service_account: github-development@cloud-board-development.iam.gserviceaccount.com
      - name: Deploy stamped development web
        run: node tool/firebase/environments.mjs deploy development web
