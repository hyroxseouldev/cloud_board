name: Deploy isolated development Firebase

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-development
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
      - name: Check isolated configuration and current/released client contracts
        env:
          CONTRACT_BASE_REF: ${{ github.event.before || github.sha }}
        run: |
          node tool/firebase/environments.mjs check
          flutter pub get
          node --test tool/tv-recovery-check.test.mjs
          node tool/tv-recovery-check.mjs
          npm ci --prefix functions
          npm test --prefix functions
          node --test tool/firebase/*.test.mjs
          node tool/firebase_contracts.mjs
      - name: Retain TV recovery regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv-recovery-development-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/sta176/
          if-no-files-found: error
          retention-days: 30

      - name: Build and stamp development web
        run: node tool/firebase/environments.mjs build development
      - uses: actions/upload-artifact@v4
        with:
          name: development-web-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/web/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Retain contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: development-contracts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/contracts/
            build/firebase-contracts/
          if-no-files-found: error
          retention-days: 30

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci --prefix functions
      - uses: actions/download-artifact@v4
        with:
          name: development-web-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/web
      - name: Authenticate only to development
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1339501332/locations/global/workloadIdentityPools/github-development/providers/github
          service_account: github-development@cloud-board-development.iam.gserviceaccount.com
      - name: Deploy development compatibility backend
        run: node tool/firebase/environments.mjs deploy development backend
      - name: Deploy verified development rules
        run: node tool/firebase/environments.mjs deploy development rules
      - name: Deploy stamped development web
        run: node tool/firebase/environments.mjs deploy development web
