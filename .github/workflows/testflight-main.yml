# One-time owner-authorized upload of the already verified 1.2.1 IPA.
# This workflow is restricted to its temporary branch and must not be merged.
name: Upload verified iOS 1.2.1 artifact to TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: testflight-main
  cancel-in-progress: false

jobs:
  upload:
    name: Upload verified IPA to TestFlight
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'hyroxseouldev/cloud_board' &&
      github.ref == 'refs/heads/hyroxseouldev/release121-mobile-first'
    runs-on: macos-26
    timeout-minutes: 30
    environment: testflight

    steps:
      - name: Checkout temporary upload-only branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify owner exception, unchanged backend and exact signed IPA
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tool/release/mobile_first_artifact.py ios

      - name: Retain native metadata and owner exception audit
        if: >-
          always() && !cancelled() &&
          env.NATIVE_METADATA_PATH != '' && env.NATIVE_AUDIT_PATH != ''
        uses: actions/upload-artifact@v4
        with:
          name: cloudboard-ios-mobile-first-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.NATIVE_METADATA_PATH }}
            ${{ env.NATIVE_AUDIT_PATH }}
          if-no-files-found: error
          retention-days: 90

      - name: Install App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -euo pipefail

          required=(
            APP_STORE_CONNECT_API_KEY_BASE64
            APP_STORE_CONNECT_ISSUER_ID
            APP_STORE_CONNECT_KEY_ID
          )
          for variable in "${required[@]}"; do
            if [[ -z "${!variable:-}" ]]; then
              echo "Missing TestFlight environment secret: $variable" >&2
              exit 1
            fi
          done

          umask 077
          private_keys_directory="$HOME/.appstoreconnect/private_keys"
          api_key_path="$private_keys_directory/AuthKey_$APP_STORE_CONNECT_KEY_ID.p8"
          echo "APP_STORE_CONNECT_API_KEY_PATH=$api_key_path" >> "$GITHUB_ENV"
          mkdir -p "$private_keys_directory"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$api_key_path"
          chmod 600 "$api_key_path"

      - name: Recheck App Store Connect build history before publishing
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -euo pipefail
          test "$RELEASE_VERSION_NAME" = '1.2.1'
          test -n "$NATIVE_BUILD_NUMBER"
          test -f "$NATIVE_ARTIFACT_PATH"
          test -f "$NATIVE_METADATA_PATH"
          test -f "$NATIVE_AUDIT_PATH"
          export TESTFLIGHT_BUILD_NUMBER="$NATIVE_BUILD_NUMBER"
          echo "TESTFLIGHT_BUILD_NUMBER=$TESTFLIGHT_BUILD_NUMBER" >> "$GITHUB_ENV"
          node tool/release/ios_build_number.mjs --recheck

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -euo pipefail
          test -f "$NATIVE_ARTIFACT_PATH"
          xcrun altool \
            --upload-app \
            --type ios \
            --file "$NATIVE_ARTIFACT_PATH" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Clean up App Store Connect API key
        if: always()
        run: |
          if [[ -n "${APP_STORE_CONNECT_API_KEY_PATH:-}" ]]; then
            rm -f "$APP_STORE_CONNECT_API_KEY_PATH"
          fi
