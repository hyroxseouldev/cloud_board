name: Upload iOS to TestFlight
run-name: "testflight · ${{ github.event_name == 'workflow_run' && 'release' || github.event_name == 'push' && 'qa' || inputs.release_mode }} · ${{ github.event.workflow_run.head_branch || inputs.source_ref || github.ref_name }}"

on:
  push:
    tags: ['dev/v*']
  workflow_run:
    workflows: [Deploy Flutter Web to Firebase Hosting]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Deployment tag (QA dev/vX.Y.Z-N; release vX.Y.Z), already in main
        required: true
        type: string
      release_mode:
        description: "Separate apps: .dev QA uses development Firebase; validated release uses production"
        required: true
        type: choice
        options: [qa, release]
        default: qa
      skip_ci:
        description: Skip integration CI only for a manual release tag upload
        required: true
        type: boolean
        default: false
      skip_ci_reason:
        description: Required reason when skip_ci is true
        required: false
        type: string
      upload_to_testflight:
        description: Upload to TestFlight (false keeps a signed artifact only)
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ (github.event_name == 'workflow_run' || inputs.release_mode == 'release') && 'testflight-main' || 'testflight-development' }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Check mobile environment readiness
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/dev/')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    environment: testflight
    outputs:
      ready: ${{ steps.readiness.outputs.ready }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      control_sha: ${{ steps.source.outputs.control_sha }}
    env:
      SOURCE_REF: ${{ inputs.source_ref || github.ref }}
      RELEASE_MODE: ${{ github.event_name == 'workflow_run' && 'release' || github.event_name == 'push' && 'qa' || inputs.release_mode }}
      SKIP_CI: ${{ inputs.skip_ci || false }}
      CI_SKIP_REASON: ${{ inputs.skip_ci_reason || '' }}
      UPLOAD_REQUESTED: ${{ github.event_name != 'workflow_dispatch' || inputs.upload_to_testflight }}
    steps:
      - name: Checkout trusted preflight tools
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && 'main' || github.sha }}
          path: control
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check selected mobile release target
        id: followup
        working-directory: control
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tool/release/mobile_followup.mjs
      - name: Resolve and pin trusted app source
        id: source
        if: steps.followup.outputs.requested == 'true'
        working-directory: control
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tool/release/source.mjs resolve
      - name: Report blocked development store setup
        id: readiness
        if: steps.followup.outputs.requested == 'true'
        env:
          RELEASE_MODE: ${{ github.event_name == 'workflow_run' && 'release' || github.event_name == 'push' && 'qa' || inputs.release_mode }}
          SKIP_CI: ${{ inputs.skip_ci || false }}
          DEVELOPMENT_READY: ${{ vars.MOBILE_DEVELOPMENT_READY }}
        run: |
          if [[ "$SKIP_CI" == true && "$RELEASE_MODE" != release ]]; then
            echo 'CI skipping requires a manual release with a versioned tag.' >&2
            exit 1
          fi
          if [[ "$RELEASE_MODE" == qa && "$DEVELOPMENT_READY" != true ]]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '## BLOCKED — development mobile distribution is not configured' >> "$GITHUB_STEP_SUMMARY"
            echo 'No app was built or uploaded. Confirm the .dev store app and signing access for the shared testflight account, then set this environment’s MOBILE_DEVELOPMENT_READY variable to true. App package and Firebase remain development-only.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi

  upload:
    name: Build and optionally upload
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    environment: testflight
    defaults:
      run:
        working-directory: app
    env:
      SOURCE_REF: ${{ inputs.source_ref || github.ref }}
      PINNED_SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
      RELEASE_MODE: ${{ github.event_name == 'workflow_run' && 'release' || github.event_name == 'push' && 'qa' || inputs.release_mode }}
      SKIP_CI: ${{ inputs.skip_ci || false }}
      CI_SKIP_REASON: ${{ inputs.skip_ci_reason || '' }}
      UPLOAD_REQUESTED: ${{ github.event_name != 'workflow_dispatch' || inputs.upload_to_testflight }}
      IOS_BUNDLE_ID: ${{ (github.event_name == 'workflow_run' || inputs.release_mode == 'release') && 'com.sunmkim.cloudboard' || 'com.sunmkim.cloudboard.dev' }}
      IOS_TEAM_ID: NL7AM62SB9

    steps:
      - name: Checkout trusted workflow tools
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.control_sha }}
          path: control
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve and pin trusted app source
        working-directory: control
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tool/release/source.mjs resolve

      - name: Checkout selected app commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: app
          fetch-depth: 0
          persist-credentials: false

      - name: Check backend compatibility before native build
        if: env.RELEASE_MODE == 'release' && env.UPLOAD_REQUESTED == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node "$GITHUB_WORKSPACE/control/tool/release_backend_gate.mjs" --mode "$RELEASE_MODE" --source-sha "$SOURCE_SHA" --check-only --mobile

      - name: QA build does not publish app update news
        if: env.RELEASE_MODE == 'qa'
        run: echo 'Development .dev app and development Firebase; QA does not publish public app news or minimum-version changes. Store tester groups retain their current settings.'

      - name: Check release credentials
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          required=(
            APP_STORE_CONNECT_API_KEY_BASE64
            APP_STORE_CONNECT_ISSUER_ID
            APP_STORE_CONNECT_KEY_ID
            IOS_DISTRIBUTION_CERTIFICATE_BASE64
            IOS_DISTRIBUTION_CERTIFICATE_PASSWORD
          )

          missing=()
          for variable in "${required[@]}"; do
            if [[ -z "${!variable:-}" ]]; then
              missing+=("$variable")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "Missing TestFlight environment secrets: ${missing[*]}" >&2
            exit 1
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: app/.fvmrc
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Xcode
        run: |
          set -euo pipefail
          xcodebuild -version

      - name: Install App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -euo pipefail

          private_keys_directory="$HOME/.appstoreconnect/private_keys"
          api_key_path="$private_keys_directory/AuthKey_$APP_STORE_CONNECT_KEY_ID.p8"
          echo "APP_STORE_CONNECT_API_KEY_PATH=$api_key_path" >> "$GITHUB_ENV"
          mkdir -p "$private_keys_directory"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$api_key_path"
          chmod 600 "$api_key_path"

      - name: Install iOS signing identity
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          certificate_path="$RUNNER_TEMP/distribution.p12"
          keychain_path="$RUNNER_TEMP/testflight-signing.keychain-db"
          keychain_password="$(uuidgen)"

          echo "IOS_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"

          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          if ! security find-identity -v -p codesigning "$keychain_path" | grep -q 'Apple Distribution'; then
            echo 'Apple Distribution signing identity was not imported.' >&2
            exit 1
          fi

      - name: Set marketing version and next iOS build from complete history
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          node "$GITHUB_WORKSPACE/control/tool/release/play_version_code.mjs" --version-name
          node "$GITHUB_WORKSPACE/control/tool/release/ios_build_number.mjs" --next

      - name: Create export options
        run: |
          set -euo pipefail

          export_options_path="$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c 'Clear dict' "$export_options_path"
          /usr/libexec/PlistBuddy -c 'Add :method string app-store-connect' "$export_options_path"
          /usr/libexec/PlistBuddy -c 'Add :destination string export' "$export_options_path"
          /usr/libexec/PlistBuddy -c 'Add :signingStyle string automatic' "$export_options_path"
          /usr/libexec/PlistBuddy -c "Add :teamID string $IOS_TEAM_ID" "$export_options_path"
          /usr/libexec/PlistBuddy -c 'Add :manageAppVersionAndBuildNumber bool false' "$export_options_path"
          /usr/libexec/PlistBuddy -c 'Add :uploadSymbols bool true' "$export_options_path"

          plutil -lint "$export_options_path"
          echo "IOS_EXPORT_OPTIONS_PATH=$export_options_path" >> "$GITHUB_ENV"

      - name: Build unsigned archive
        run: |
          set -euo pipefail

          flutter build ipa --flavor "$APP_ENVIRONMENT" \
            --release \
            --dart-define=FIREBASE_ENV="$APP_ENVIRONMENT" \
            --build-name "$RELEASE_VERSION_NAME" \
            --no-codesign \
            --build-number "$TESTFLIGHT_BUILD_NUMBER"

          archive_path="$GITHUB_WORKSPACE/app/build/ios/archive/Runner.xcarchive"
          if [[ ! -d "$archive_path" ]]; then
            echo 'The unsigned iOS archive was not created.' >&2
            exit 1
          fi
          echo "IOS_ARCHIVE_PATH=$archive_path" >> "$GITHUB_ENV"

      - name: Keep dSYMs for crash report recovery
        uses: actions/upload-artifact@v4
        with:
          name: cloudboard-ios-dsyms-${{ env.TESTFLIGHT_BUILD_NUMBER }}
          path: app/build/ios/archive/Runner.xcarchive/dSYMs
          if-no-files-found: error
          retention-days: 90

      - name: Preserve source entitlements in unsigned archive
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/control/tool/prepare_ios_entitlements.py" \
            "$IOS_ARCHIVE_PATH" ios/Runner/Runner.entitlements \
            --team-id "$IOS_TEAM_ID" --bundle-id "$IOS_BUNDLE_ID"

      - name: Export signed IPA
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -euo pipefail

          mkdir -p build/ios/ipa
          xcodebuild \
            -exportArchive \
            -archivePath "$IOS_ARCHIVE_PATH" \
            -exportPath build/ios/ipa \
            -exportOptionsPlist "$IOS_EXPORT_OPTIONS_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APP_STORE_CONNECT_API_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Inspect exported Apple sign-in permissions
        run: |
          set -euo pipefail
          ipa_path="$(find build/ios/ipa -type f -name '*.ipa' -print -quit)"
          python3 "$GITHUB_WORKSPACE/control/tool/inspect_ios_signing.py" "$ipa_path" "$RUNNER_TEMP/ios-signing.json" \
            --team-id "$IOS_TEAM_ID" --bundle-id "$IOS_BUNDLE_ID"

      - name: Verify actual IPA version, package and native/Dart Firebase binding
        run: |
          set -euo pipefail
          ipa_path="$(find build/ios/ipa -type f -name '*.ipa' -print -quit)"
          python3 "$GITHUB_WORKSPACE/control/tool/release/inspect_native.py" ios "$ipa_path" \
            --version "$RELEASE_VERSION_NAME" --build "$TESTFLIGHT_BUILD_NUMBER" \
            --environment "$APP_ENVIRONMENT" --output "$RUNNER_TEMP/ios-release-metadata.json"

      - name: Reuse tag integration validation for release upload
        if: env.RELEASE_MODE == 'release' && env.UPLOAD_REQUESTED == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node "$GITHUB_WORKSPACE/control/tool/release/common_validation.mjs" --source-sha "$SOURCE_SHA" --release-tag "$RELEASE_TAG"

      - name: Record app source and signed artifact identity
        run: node "$GITHUB_WORKSPACE/control/tool/release/source.mjs" receipt "$RUNNER_TEMP/ios-release-metadata.json" "$RUNNER_TEMP/release.json"

      - name: Retain mobile source receipt
        uses: actions/upload-artifact@v4
        with:
          name: mobile-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release.json
          if-no-files-found: error
          retention-days: 90

      - name: Keep signed IPA and release evidence
        uses: actions/upload-artifact@v4
        with:
          name: cloudboard-ios-release-${{ env.TESTFLIGHT_BUILD_NUMBER }}
          path: |
            app/build/ios/ipa/*.ipa
            ${{ runner.temp }}/ios-release-metadata.json
          if-no-files-found: error
          retention-days: 14

      - name: Keep signing diagnostics
        if: ${{ !cancelled() && env.TESTFLIGHT_BUILD_NUMBER != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: cloudboard-ios-signing-${{ env.TESTFLIGHT_BUILD_NUMBER }}
          path: ${{ runner.temp }}/ios-signing.json
          if-no-files-found: warn
          retention-days: 90

      - name: Recheck backend compatibility and build number before publishing
        if: env.UPLOAD_REQUESTED == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          if [[ "$RELEASE_MODE" == release ]]; then
            node "$GITHUB_WORKSPACE/control/tool/release_backend_gate.mjs" --mode release --source-sha "$SOURCE_SHA" --check-only --mobile
          fi
          node "$GITHUB_WORKSPACE/control/tool/release/ios_build_number.mjs" --recheck

      - name: Upload dSYMs to Firebase Crashlytics
        if: env.UPLOAD_REQUESTED == 'true'
        run: |
          set -euo pipefail

          # Flutter stores the resolved Swift packages under build/ios.
          upload_symbols="$GITHUB_WORKSPACE/app/build/ios/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/upload-symbols"
          dsym_directory="$IOS_ARCHIVE_PATH/dSYMs"
          google_service_plist="$IOS_ARCHIVE_PATH/Products/Applications/Runner.app/GoogleService-Info.plist"

          if [[ ! -x "$upload_symbols" || ! -f "$google_service_plist" ]]; then
            echo 'Missing Crashlytics upload tool or archived Firebase configuration.' >&2
            exit 1
          fi
          for required_dsym in Runner.app.dSYM App.framework.dSYM; do
            if [[ ! -d "$dsym_directory/$required_dsym" ]]; then
              echo "Missing release dSYM: $required_dsym" >&2
              exit 1
            fi
          done

          "$upload_symbols" -gsp "$google_service_plist" -p ios "$dsym_directory"

      - name: Retain checked production backend
        if: env.RELEASE_MODE == 'release' && env.UPLOAD_REQUESTED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mobile-backend-reference-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mobile-backend-reference.json
          if-no-files-found: error
          retention-days: 90

      - name: Recheck deployment tag before upload
        if: env.UPLOAD_REQUESTED == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node "$GITHUB_WORKSPACE/control/tool/release/source.mjs" recheck

      - name: Upload to TestFlight
        if: env.UPLOAD_REQUESTED == 'true'
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -euo pipefail

          ipa_path="$(find build/ios/ipa -type f -name '*.ipa' -print -quit)"
          if [[ -z "$ipa_path" ]]; then
            echo 'The signed IPA was not created.' >&2
            exit 1
          fi

          xcrun altool \
            --upload-app \
            --type ios \
            --file "$ipa_path" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Clean up signing files
        if: always()
        run: |
          if [[ -n "${IOS_KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$IOS_KEYCHAIN_PATH" || true
          fi
          if [[ -n "${APP_STORE_CONNECT_API_KEY_PATH:-}" ]]; then
            rm -f "$APP_STORE_CONNECT_API_KEY_PATH"
          fi
