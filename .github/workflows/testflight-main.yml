name: Upload iOS to TestFlight

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testflight-main
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message, '[skip testflight]')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  upload:
    name: Build and upload
    needs: verify
    runs-on: macos-26
    timeout-minutes: 45
    environment: testflight
    env:
      IOS_BUNDLE_ID: com.sunmkim.cloudboard
      IOS_TEAM_ID: NL7AM62SB9

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check release credentials
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          required=(
            APP_STORE_CONNECT_API_KEY_BASE64
            APP_STORE_CONNECT_ISSUER_ID
            APP_STORE_CONNECT_KEY_ID
            IOS_DISTRIBUTION_CERTIFICATE_BASE64
            IOS_DISTRIBUTION_CERTIFICATE_PASSWORD
          )

          missing=()
          for variable in "${required[@]}"; do
            if [[ -z "${!variable:-}" ]]; then
              missing+=("$variable")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "Missing TestFlight environment secrets: ${missing[*]}" >&2
            exit 1
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Xcode
        run: |
          set -euo pipefail
          xcodebuild -version

      - name: Install App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -euo pipefail

          private_keys_directory="$HOME/.appstoreconnect/private_keys"
          api_key_path="$private_keys_directory/AuthKey_$APP_STORE_CONNECT_KEY_ID.p8"
          echo "APP_STORE_CONNECT_API_KEY_PATH=$api_key_path" >> "$GITHUB_ENV"
          mkdir -p "$private_keys_directory"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$api_key_path"
          chmod 600 "$api_key_path"

      - name: Install iOS signing identity
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          certificate_path="$RUNNER_TEMP/distribution.p12"
          keychain_path="$RUNNER_TEMP/testflight-signing.keychain-db"
          keychain_password="$(uuidgen)"

          echo "IOS_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"

          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          if ! security find-identity -v -p codesigning "$keychain_path" | grep -q 'Apple Distribution'; then
            echo 'Apple Distribution signing identity was not imported.' >&2
            exit 1
          fi

      - name: Set build number
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -euo pipefail

          token="$({ ruby -ropenssl -rbase64 -rjson <<'RUBY'
          def base64url(data)
            Base64.urlsafe_encode64(data, padding: false)
          end

          key = OpenSSL::PKey::EC.new(File.read(ENV.fetch('APP_STORE_CONNECT_API_KEY_PATH')))
          header = {
            alg: 'ES256',
            kid: ENV.fetch('APP_STORE_CONNECT_KEY_ID'),
            typ: 'JWT',
          }
          payload = {
            iss: ENV.fetch('APP_STORE_CONNECT_ISSUER_ID'),
            exp: Time.now.to_i + (20 * 60),
            aud: 'appstoreconnect-v1',
          }
          signing_input = "#{base64url(header.to_json)}.#{base64url(payload.to_json)}"
          sequence = OpenSSL::ASN1.decode(
            key.dsa_sign_asn1(OpenSSL::Digest::SHA256.digest(signing_input)),
          )
          r = sequence.value[0].value.to_s(2).rjust(32, "\0")[-32, 32]
          s = sequence.value[1].value.to_s(2).rjust(32, "\0")[-32, 32]
          print "#{signing_input}.#{base64url(r + s)}"
          RUBY
          } 2>/dev/null)"

          app_id="$(
            curl --fail --silent --show-error --retry 3 \
              -H "Authorization: Bearer $token" \
              "https://api.appstoreconnect.apple.com/v1/apps?filter%5BbundleId%5D=$IOS_BUNDLE_ID&limit=1" |
              ruby -rjson -e 'print JSON.parse(STDIN.read).dig("data", 0, "id")'
          )"
          if [[ -z "$app_id" ]]; then
            echo "App Store Connect app not found: $IOS_BUNDLE_ID" >&2
            exit 1
          fi

          latest_build="$(
            curl --fail --silent --show-error --retry 3 \
              -H "Authorization: Bearer $token" \
              "https://api.appstoreconnect.apple.com/v1/builds?filter%5Bapp%5D=$app_id&sort=-uploadedDate&limit=1" |
              ruby -rjson -e 'print JSON.parse(STDIN.read).dig("data", 0, "attributes", "version")'
          )"
          if [[ ! "$latest_build" =~ ^[0-9]+$ ]]; then
            echo "Invalid latest TestFlight build number: $latest_build" >&2
            exit 1
          fi

          build_number=$((latest_build + 1))
          echo "TESTFLIGHT_BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
          echo "TestFlight build number: $build_number"

      - name: Create export options
        run: |
          set -euo pipefail

          export_options_path="$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c 'Clear dict' "$export_options_path"
          /usr/libexec/PlistBuddy -c 'Add :method string app-store-connect' "$export_options_path"
          /usr/libexec/PlistBuddy -c 'Add :destination string export' "$export_options_path"
          /usr/libexec/PlistBuddy -c 'Add :signingStyle string automatic' "$export_options_path"
          /usr/libexec/PlistBuddy -c "Add :teamID string $IOS_TEAM_ID" "$export_options_path"
          /usr/libexec/PlistBuddy -c 'Add :manageAppVersionAndBuildNumber bool false' "$export_options_path"
          /usr/libexec/PlistBuddy -c 'Add :uploadSymbols bool true' "$export_options_path"

          plutil -lint "$export_options_path"
          echo "IOS_EXPORT_OPTIONS_PATH=$export_options_path" >> "$GITHUB_ENV"

      - name: Build unsigned archive
        run: |
          set -euo pipefail

          flutter build ipa \
            --release \
            --no-codesign \
            --build-number "$TESTFLIGHT_BUILD_NUMBER"

          archive_path="$GITHUB_WORKSPACE/build/ios/archive/Runner.xcarchive"
          if [[ ! -d "$archive_path" ]]; then
            echo 'The unsigned iOS archive was not created.' >&2
            exit 1
          fi
          echo "IOS_ARCHIVE_PATH=$archive_path" >> "$GITHUB_ENV"

      - name: Export signed IPA
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -euo pipefail

          mkdir -p build/ios/ipa
          xcodebuild \
            -exportArchive \
            -archivePath "$IOS_ARCHIVE_PATH" \
            -exportPath build/ios/ipa \
            -exportOptionsPlist "$IOS_EXPORT_OPTIONS_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APP_STORE_CONNECT_API_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -euo pipefail

          ipa_path="$(find build/ios/ipa -type f -name '*.ipa' -print -quit)"
          if [[ -z "$ipa_path" ]]; then
            echo 'The signed IPA was not created.' >&2
            exit 1
          fi

          xcrun altool \
            --upload-app \
            --type ios \
            --file "$ipa_path" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Clean up signing files
        if: always()
        run: |
          if [[ -n "${IOS_KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$IOS_KEYCHAIN_PATH" || true
          fi
          if [[ -n "${APP_STORE_CONNECT_API_KEY_PATH:-}" ]]; then
            rm -f "$APP_STORE_CONNECT_API_KEY_PATH"
          fi
