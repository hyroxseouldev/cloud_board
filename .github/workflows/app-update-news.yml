name: Publish app update news

on:
  workflow_dispatch:
    inputs:
      deployment_run_id:
        description: Existing production deployment run whose app update news should be published (does not rebuild the app)
        required: true
        type: string
  workflow_run:
    workflows:
      - Deploy Flutter Web to Firebase Hosting
      - Upload Android and TV to Google Play
      - Upload iOS to TestFlight
    types: [completed]
    branches: [main, 'v*']

permissions:
  contents: read
  actions: read

jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
      (github.event.workflow_run.head_branch == 'main' || startsWith(github.event.workflow_run.head_branch, 'v')) &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch' || github.event.workflow_run.event == 'workflow_run'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Retain the previous group so in-flight jobs from the old workflow cannot
    # overlap this publisher during the transition. Later events re-read all
    # three pipelines, including reruns.
    concurrency:
      group: linear-deployment-publisher
      cancel-in-progress: false
    steps:
      # Run only trusted default-branch code, never a downloaded build artifact.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare app update news for confirmed builds
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UPDATE_NEWS_OUTPUT_PATH: ${{ runner.temp }}/update-news.json
        run: node tool/update-news/publish.mjs
      - name: Check for publishable update news
        id: news
        run: |
          if test -f "$RUNNER_TEMP/update-news.json"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Authenticate update news publisher
        if: steps.news.outputs.exists == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CLOUD_BOARD_STATIOND }}'
      - name: Cache publisher npm downloads
        if: steps.news.outputs.exists == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node22-update-news-${{ hashFiles('functions/package-lock.json') }}
      - name: Install update news publisher dependencies
        if: steps.news.outputs.exists == 'true'
        run: npm ci --omit=dev --prefix functions
      - name: Publish app update news
        if: steps.news.outputs.exists == 'true'
        run: node functions/tools/publish-update-news.mjs "$RUNNER_TEMP/update-news.json" --apply
