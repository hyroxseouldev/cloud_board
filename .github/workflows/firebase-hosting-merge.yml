name: Deploy Flutter Web to Firebase Hosting

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - develop

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Set up Node for account deletion functions
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Test account deletion functions
        run: |
          npm ci --prefix functions
          npm test --prefix functions

      - name: Validate database rules JSON
        run: python3 -m json.tool database.rules.json > /dev/null

      - name: Authenticate Firebase rule deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CLOUD_BOARD_STATIOND }}'

      - name: Deploy account deletion functions and data rules
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx --yes firebase-tools deploy --only functions:account-deletion,firestore:rules,firestore:indexes,database,storage --project cloud-board-stationd --non-interactive

      - name: Build Flutter web app
        run: |
          flutter build web --release

      - name: Deploy to Firebase Hosting
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CLOUD_BOARD_STATIOND }}'
          channelId: live
          projectId: cloud-board-stationd
