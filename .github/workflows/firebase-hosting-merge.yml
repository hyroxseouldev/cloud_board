name: Deploy Flutter Web to Firebase Hosting

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
    inputs:
      scope:
        description: 'Run on a release tag for production retry; main supports verify only'
        required: true
        type: choice
        default: verify
        options: [verify, web, rules, backend, full]
      deploy_mobile:
        description: 'Also upload iOS and Android/TV after this release succeeds (release tag only)'
        type: boolean
        default: false
      confirm_sha:
        description: 'Paste the exact selected tag commit SHA (main SHA for verification only)'
        required: true
        type: string
      skip_ci:
        description: 'Skip heavy CI only for this manual release-tag deployment; required build and deploy checks still run'
        required: false
        type: boolean
        default: false
      skip_ci_reason:
        description: 'Required explanation when skip_ci is true; recorded in release audit evidence'
        required: false
        type: string

permissions:
  contents: read
  actions: read

# Validation can run concurrently. Only production writes hold a non-cancelling lock.

jobs:
  class_start_regressions:
    needs: deployment_plan
    if: needs.deployment_plan.outputs.validation_mode == 'required' && (needs.deployment_plan.outputs.release_tag != '' || contains(fromJSON('["web","full","verify"]'), needs.deployment_plan.outputs.scope))
    uses: ./.github/workflows/class-start-regressions.yml

  deployment_plan:
    name: Verify deployment target
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.plan.outputs.scope }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
      release_tag: ${{ steps.plan.outputs.release_tag }}
      contract_base_sha: ${{ steps.plan.outputs.contract_base_sha }}
      validation_mode: ${{ steps.plan.outputs.validation_mode }}
      mobile_requested: ${{ steps.plan.outputs.mobile_requested }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate release tag, reviewed source and deployment scope
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tool/firebase/deployment-plan.mjs
      - name: Retain release validation policy (not test results)
        uses: actions/upload-artifact@v4
        with:
          name: release-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/release/validation/release.json
          if-no-files-found: error
          retention-days: 90

  app_validation:
    name: app-validation
    needs: deployment_plan
    if: needs.deployment_plan.outputs.validation_mode == 'required' && (needs.deployment_plan.outputs.release_tag != '' || contains(fromJSON('["web","full","verify"]'), needs.deployment_plan.outputs.scope))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node for generators and account deletion functions
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Verify product display configuration and identifier contracts
        run: |
          node tool/brand.mjs --check
          node --test tool/brand.test.mjs tool/brand-platforms.test.mjs tool/ios-firebase-environment.test.mjs tool/startup_loading.test.mjs

      - name: Verify Firebase environment isolation
        run: node tool/firebase/environments.mjs check

      - name: Test iOS signing checks
        run: python3 -m unittest discover -s tool -p 'test_ios_signing.py'

      - name: Test native release identity, update news, and build-only upload guards
        run: |
          node --test tool/release/*.test.mjs
          node --test tool/update-news/*.test.mjs
          python3 -m unittest discover -s tool/release -p 'test_*.py'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Test alternate brand and historical data in an isolated copy
        run: node tool/brand-smoke.mjs

      - name: Require TV recovery regressions without missing or skipped cases
        run: |
          node --test tool/tv-recovery-check.test.mjs
          node tool/tv-recovery-check.mjs

      - name: Retain TV recovery regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv-recovery-web-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/sta176/
          if-no-files-found: error
          retention-days: 30

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Test web command and diagnostic regressions in Chrome
        run: flutter test --platform chrome test/event_id_test.dart test/error_reporter_test.dart test/class_stability_test.dart test/playback_command_throttle_test.dart test/timer_editor_test.dart test/timer_modes_test.dart test/timer_editing_test.dart test/timer_editor_flow_test.dart test/main_navigation_test.dart test/soft_rhythm_loading_mark_test.dart test/app_startup_screen_test.dart test/startup_performance_test.dart

      - name: Test preparation and library regressions in Chrome
        run: >-
          flutter test --platform chrome
          test/library_management_test.dart
          test/workout_error_message_test.dart
          test/slide_draft_assets_test.dart
          test/draft_asset_store_web_test.dart
          test/workout_catalog_incremental_test.dart
          test/original_slide_cache_test.dart
          test/slide_design_asset_reuse_test.dart
          test/slide_editor_bottom_tabs_test.dart
          test/timer_duration_wheel_test.dart

      - name: Test client compatibility and rollout regressions in Chrome
        run: >-
          flutter test --platform chrome
          test/firebase_environment_test.dart
          test/runtime_feature_policy_test.dart
          test/remote_feature_rollout_test.dart
          test/workout_recovery_test.dart
          test/workout_recovery_widget_test.dart
          test/playback_recovery_test.dart
          test/app_update_test.dart
          test/display_mode_flow_test.dart
          test/audience_branding_data_test.dart
          test/audience_logo_test.dart
          test/display_preparation_test.dart
          test/operation_telemetry_test.dart
          test/playback_ack_test.dart
          test/onboarding_test.dart

      - name: Test support submission and account boundaries in Chrome
        run: flutter test --platform chrome test/support_ticket_test.dart test/support_screen_test.dart test/error_reporter_test.dart test/auth_router_test.dart

      - name: Test legacy server compatibility
        if: needs.deployment_plan.outputs.scope == 'verify'
        run: |
          npm ci --prefix functions-legacy
          npm run check --prefix functions-legacy
          node tool/legacy-auth-release.mjs check
          node --test tool/legacy-auth-release.test.mjs

      - name: Test account deletion functions
        if: needs.deployment_plan.outputs.scope == 'verify'
        run: |
          npm ci --prefix functions
          npm test --prefix functions
          node --test tool/web_symbols.test.mjs tool/release_backend_gate.test.mjs tool/firebase/*.test.mjs

  mobile_backend_compatibility:
    name: mobile-backend-compatibility
    needs: deployment_plan
    # Server-first releases keep the exact-match fast path. Mobile-first verifies
    # the deployed backend, including when a web-only release explicitly skips CI.
    if: needs.deployment_plan.outputs.mobile_requested == 'true' && contains(fromJSON('["verify","web"]'), needs.deployment_plan.outputs.scope)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin deployed backend and reviewed mobile test plan
        id: compatibility
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tool/release/verify_mobile_backend.mjs prepare
      - uses: subosito/flutter-action@v2
        if: steps.compatibility.outputs.needs_tests == 'true'
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        if: steps.compatibility.outputs.needs_tests == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - name: Install mobile contract dependencies
        if: steps.compatibility.outputs.needs_tests == 'true'
        run: flutter pub get
      - name: Test mobile against deployed backend
        if: steps.compatibility.outputs.needs_tests == 'true'
        run: node tool/release/verify_mobile_backend.mjs test
      - name: Retain mobile backend compatibility
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-backend-compatibility-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/release/mobile-backend-compatibility/
          if-no-files-found: error
          retention-days: 90

  web_build:
    name: web-build
    needs: deployment_plan
    if: contains(fromJSON('["web","full","verify"]'), needs.deployment_plan.outputs.scope)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify build identity and Firebase environment isolation
        run: |
          node tool/brand.mjs --check
          node tool/firebase/environments.mjs check
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
      - name: Install build dependencies
        run: flutter pub get

      - name: Build Flutter web app
        run: |
          set -euo pipefail
          build_name="$(awk '/^version:/ {split($2, version, "+"); print version[1]; exit}' pubspec.yaml)"
          test -n "$build_name"
          # Include the attempt so rerunning a deployment remains identifiable.
          build_number="$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
          flutter build web --release --source-maps --dart-define=FIREBASE_ENV=production \
            --build-name "$build_name" \
            --build-number "$build_number" \
            --dart-define="APP_BUILD_NAME=$build_name" \
            --dart-define="APP_BUILD_NUMBER=$build_number"
          python3 - "$build_number" <<'PY'
          import json, sys
          with open('build/web/version.json') as file:
              assert json.load(file)['build_number'] == sys.argv[1]
          PY
          echo "Web build: $build_name ($build_number)" >> "$GITHUB_STEP_SUMMARY"

      - name: Encrypt web symbols
        if: contains(fromJSON('["web","full"]'), needs.deployment_plan.outputs.scope) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/v')
        env:
          WEB_SYMBOLS_ENCRYPTION_KEY: ${{ secrets.WEB_SYMBOLS_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          umask 077
          tar -czf "$RUNNER_TEMP/web-symbols.tgz" -C build/web main.dart.js main.dart.js.map version.json
          node tool/web_symbols.mjs seal "$RUNNER_TEMP/web-symbols.tgz" "$RUNNER_TEMP/web-symbols-v1.tgz.enc"

      - name: Retain encrypted web symbols
        if: contains(fromJSON('["web","full"]'), needs.deployment_plan.outputs.scope) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: cloudboard-web-symbols-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/web-symbols-v1.tgz.enc
          if-no-files-found: error
          retention-days: 90

      - name: Remove source maps from public bundle
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import re
          for path in Path('build/web').rglob('*.map'):
              path.unlink()
          for path in Path('build/web').rglob('*.js'):
              path.write_text(re.sub(r'(?m)^//# sourceMappingURL=.*$', '', path.read_text()))
          PYTHON

      - name: Retain verified web build
        uses: actions/upload-artifact@v4
        with:
          name: firebase-web-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/web/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  firebase_contracts:
    name: firebase-contracts
    needs: deployment_plan
    if: needs.deployment_plan.outputs.validation_mode == 'required' && contains(fromJSON('["backend","rules","full","verify"]'), needs.deployment_plan.outputs.scope)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install contract dependencies
        run: |
          flutter pub get
          npm ci --prefix functions
      - name: Test server and release tooling
        run: |
          npm test --prefix functions
          node --test tool/release_backend_gate.test.mjs tool/firebase/*.test.mjs
      - name: Verify latest installed clients have frozen contracts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tool/firebase/installed-clients.mjs
      - name: Run every Firebase contract
        env:
          CONTRACT_BASE_REF: ${{ needs.deployment_plan.outputs.contract_base_sha }}
        run: node tool/firebase_contracts.mjs
      - name: Retain contract results even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firebase-contracts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/firebase-contracts/
            build/contracts/
          if-no-files-found: error
          retention-days: 30

  smoke_inputs:
    name: Prepare current candidate smoke inputs
    needs: deployment_plan
    if: needs.deployment_plan.outputs.validation_mode == 'skipped' && contains(fromJSON('["backend","rules","full"]'), needs.deployment_plan.outputs.scope)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_SOURCE_SHA: ${{ needs.deployment_plan.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
      - name: Export candidate payloads for retained live smoke (not integration CI)
        run: |
          flutter pub get
          flutter test tool/export_workout_save_fixtures_test.dart tool/export_app_contracts_test.dart
          node tool/firebase/smoke-inputs.mjs prepare
      - uses: actions/upload-artifact@v4
        with:
          name: firebase-smoke-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/release/smoke-inputs/
          if-no-files-found: error
          retention-days: 90

  firebase_required:
    name: firebase-required
    if: always() && needs.deployment_plan.result == 'success' && !contains(fromJSON('["none","verify"]'), needs.deployment_plan.outputs.scope)
    needs: [app_validation, firebase_contracts, deployment_plan, class_start_regressions, smoke_inputs, web_build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REQUIRED_JOBS: ${{ toJSON(needs) }}
      FIREBASE_DEPLOY_SCOPE: ${{ needs.deployment_plan.outputs.scope }}
      RELEASE_SOURCE_SHA: ${{ needs.deployment_plan.outputs.source_sha }}
      RELEASE_TAG: ${{ needs.deployment_plan.outputs.release_tag }}
      RELEASE_VALIDATION_MODE: ${{ needs.deployment_plan.outputs.validation_mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: release-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/release/validation
      - name: Check deployment prerequisites and the explicit CI policy
        run: node --input-type=module -e "import {requireReleaseJobs} from './tool/firebase/release.mjs'; requireReleaseJobs(JSON.parse(process.env.REQUIRED_JOBS))"
      - uses: actions/download-artifact@v4
        if: contains(fromJSON('["web","full"]'), needs.deployment_plan.outputs.scope)
        with:
          name: firebase-web-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/web
      - uses: actions/download-artifact@v4
        if: needs.deployment_plan.outputs.validation_mode == 'required' && contains(fromJSON('["backend","rules","full"]'), needs.deployment_plan.outputs.scope)
        with:
          name: firebase-contracts-${{ github.run_id }}-${{ github.run_attempt }}
          path: build
      - uses: actions/download-artifact@v4
        if: needs.deployment_plan.outputs.validation_mode == 'skipped' && contains(fromJSON('["backend","rules","full"]'), needs.deployment_plan.outputs.scope)
        with:
          name: firebase-smoke-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/release/smoke-inputs
      - name: Verify evidence and seal release manifest
        run: node tool/firebase/release.mjs aggregate
      - uses: actions/upload-artifact@v4
        with:
          name: firebase-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/web/
            build/contracts/
            build/firebase-contracts/
            build/release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  firebase_production:
    name: firebase-production
    needs: [firebase_required, deployment_plan]
    if: >-
      always() && !cancelled() &&
      needs.firebase_required.result == 'success' && needs.deployment_plan.result == 'success' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      startsWith(github.ref, 'refs/tags/v') &&
      !contains(fromJSON('["none","verify"]'), needs.deployment_plan.outputs.scope)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: firebase-production
      cancel-in-progress: false
    env:
      GITHUB_TOKEN: ${{ github.token }}
      FIREBASE_DEPLOY_SCOPE: ${{ needs.deployment_plan.outputs.scope }}
      RELEASE_SOURCE_SHA: ${{ needs.deployment_plan.outputs.source_sha }}
      RELEASE_TAG: ${{ needs.deployment_plan.outputs.release_tag }}
      RELEASE_VALIDATION_MODE: ${{ needs.deployment_plan.outputs.validation_mode }}
      FIREBASE_RELEASE_CANARY_ENABLED: ${{ vars.FIREBASE_RELEASE_CANARY_ENABLED }}
      FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Verify production Firebase environment isolation
        run: node tool/firebase/environments.mjs check
      - run: npm ci --prefix functions
      - uses: actions/download-artifact@v4
        with:
          name: firebase-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: build
      - name: Validate candidate before deployment
        run: |
          node tool/firebase/release.mjs current
          node tool/firebase/release.mjs verify
      - name: Validate backend canary configuration and current smoke inputs
        if: needs.deployment_plan.outputs.scope != 'web'
        run: node functions/tools/release-smoke.mjs preflight
      - name: Confirm rules-only candidate preserves deployed Functions
        if: needs.deployment_plan.outputs.scope == 'rules'
        run: node tool/release_backend_gate.mjs --rules --check-only
      - name: Confirm Hosting candidate uses the deployed backend
        if: needs.deployment_plan.outputs.scope == 'web'
        run: node tool/release_backend_gate.mjs --web --check-only
      - name: Authenticate Firebase rule deployment
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CLOUD_BOARD_STATIOND }}'

      - name: Deploy account deletion functions and data rules
        if: contains(fromJSON('["backend","full"]'), needs.deployment_plan.outputs.scope)
        env:
          SOLAPI_FROM: ${{ secrets.SOLAPI_FROM }}
          APPLE_IAP_SECRETS_ENABLED: ${{ vars.APPLE_IAP_SECRETS_ENABLED || 'false' }}
          AI_TIMER_SECRETS_ENABLED: ${{ vars.AI_TIMER_SECRETS_ENABLED || 'false' }}
        run: |
          set -euo pipefail
          test -n "$SOLAPI_FROM" || { echo 'Missing SMS sender configuration.' >&2; exit 1; }
          umask 077
          sender_env=functions/.env.cloud-board-stationd
          trap 'rm -f "$sender_env"' EXIT
          printf 'SOLAPI_FROM=%s\n' "$SOLAPI_FROM" > "$sender_env"
          # Deploy and runtime must use the same explicit opt-in. No placeholder keys.
          case "$APPLE_IAP_SECRETS_ENABLED" in
            true|false) ;;
            *) echo 'Invalid Apple secret binding setting.' >&2; exit 1 ;;
          esac
          printf 'APPLE_IAP_SECRETS_ENABLED=%s\n' "$APPLE_IAP_SECRETS_ENABLED" >> "$sender_env"
          case "$AI_TIMER_SECRETS_ENABLED" in
            true|false) ;;
            *) echo 'Invalid AI timer secret binding setting.' >&2; exit 1 ;;
          esac
          printf 'AI_TIMER_SECRETS_ENABLED=%s\n' "$AI_TIMER_SECRETS_ENABLED" >> "$sender_env"
          # Approve the declared retry policy for new event functions in CI.
          node tool/firebase/release.mjs current
          node tool/firebase/release.mjs verify
          npx --yes firebase-tools@15.29.0 deploy --only functions:account-deletion --project cloud-board-stationd --non-interactive --force
          node tool/firebase/release.mjs current
          node tool/firebase/release.mjs verify
          npx --yes firebase-tools@15.29.0 deploy --only firestore:rules,firestore:indexes,database,storage --project cloud-board-stationd --non-interactive

      - name: Deploy data rules only
        if: needs.deployment_plan.outputs.scope == 'rules'
        run: |
          node tool/firebase/release.mjs current
          node tool/firebase/release.mjs verify
          npx --yes firebase-tools@15.29.0 deploy --only firestore:rules,firestore:indexes,database,storage --project cloud-board-stationd --non-interactive
      - name: Verify deployed rules
        if: needs.deployment_plan.outputs.scope != 'web'
        run: node functions/tools/live-rules.mjs build/release/manifest.json --wait
      - name: Verify client save, image and TV permissions
        if: needs.deployment_plan.outputs.scope != 'web'
        run: node functions/tools/release-smoke.mjs
      - name: Deploy to Firebase Hosting
        if: contains(fromJSON('["web","full"]'), needs.deployment_plan.outputs.scope)
        run: |
          node tool/firebase/release.mjs current
          node tool/firebase/release.mjs verify
          npx --yes firebase-tools@15.29.0 deploy --only hosting --project cloud-board-stationd --non-interactive
      - name: Publish verified release receipt
        run: |
          if [ "$FIREBASE_DEPLOY_SCOPE" != web ]; then node functions/tools/live-rules.mjs; fi
          node tool/firebase/release.mjs ready
      - name: Retain verified release receipt
        uses: actions/upload-artifact@v4
        with:
          name: firebase-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/release/
          if-no-files-found: error
          retention-days: 90
      - name: Retain partial deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firebase-attempt-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/release/
          if-no-files-found: error
          retention-days: 90
