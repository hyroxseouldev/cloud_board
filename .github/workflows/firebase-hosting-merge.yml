name: Deploy Flutter Web to Firebase Hosting

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - develop

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Test web command and diagnostic regressions in Chrome
        run: flutter test --platform chrome test/event_id_test.dart test/error_reporter_test.dart test/class_stability_test.dart test/playback_command_throttle_test.dart

      - name: Set up Node for account deletion functions
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Test account deletion functions
        run: |
          npm ci --prefix functions
          npm test --prefix functions
          node --test tool/web_symbols.test.mjs

      - name: Set up Java for Firestore rules tests
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Test account library concurrency and security rules
        run: npx --yes firebase-tools emulators:exec --config firebase.deletion-test.json --only firestore --project demo-cloudboard-library 'node functions/test/slide-library-emulator.mjs'

      - name: Test onboarding transactions and security rules
        run: npx --yes firebase-tools emulators:exec --config firebase.onboarding-test.json --only firestore,database --project demo-cloudboard-onboarding 'node functions/test/onboarding-emulator.mjs'

      - name: Test billing without Apple keys and purchase ownership
        run: npx --yes firebase-tools emulators:exec --config firebase.onboarding-test.json --only firestore,database --project demo-cloudboard-billing 'node functions/test/billing-emulator.mjs && node functions/test/google-play-emulator.mjs'

      - name: Validate database rules JSON
        run: python3 -m json.tool database.rules.json > /dev/null

      - name: Authenticate Firebase rule deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CLOUD_BOARD_STATIOND }}'

      - name: Deploy account deletion functions and data rules
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SOLAPI_FROM: ${{ secrets.SOLAPI_FROM }}
          APPLE_IAP_SECRETS_ENABLED: ${{ vars.APPLE_IAP_SECRETS_ENABLED || 'false' }}
        run: |
          set -euo pipefail
          test -n "$SOLAPI_FROM" || { echo 'Missing SMS sender configuration.' >&2; exit 1; }
          umask 077
          sender_env=functions/.env.cloud-board-stationd
          trap 'rm -f "$sender_env"' EXIT
          printf 'SOLAPI_FROM=%s\n' "$SOLAPI_FROM" > "$sender_env"
          # Deploy and runtime must use the same explicit opt-in. No placeholder keys.
          case "$APPLE_IAP_SECRETS_ENABLED" in
            true|false) ;;
            *) echo 'Invalid Apple secret binding setting.' >&2; exit 1 ;;
          esac
          printf 'APPLE_IAP_SECRETS_ENABLED=%s\n' "$APPLE_IAP_SECRETS_ENABLED" >> "$sender_env"
          # Approve the declared retry policy for new event functions in CI.
          npx --yes firebase-tools deploy --only functions:account-deletion --project cloud-board-stationd --non-interactive --force
          npx --yes firebase-tools deploy --only firestore:rules,firestore:indexes,database,storage --project cloud-board-stationd --non-interactive

      - name: Build Flutter web app
        run: |
          set -euo pipefail
          build_name="$(awk '/^version:/ {split($2, version, "+"); print version[1]; exit}' pubspec.yaml)"
          test -n "$build_name"
          # Include the attempt so rerunning a deployment remains identifiable.
          build_number="$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
          flutter build web --release --source-maps \
            --build-name "$build_name" \
            --build-number "$build_number" \
            --dart-define="APP_BUILD_NAME=$build_name" \
            --dart-define="APP_BUILD_NUMBER=$build_number"
          python3 - "$build_number" <<'PY'
          import json, sys
          with open('build/web/version.json') as file:
              assert json.load(file)['build_number'] == sys.argv[1]
          PY
          echo "Web build: $build_name ($build_number)" >> "$GITHUB_STEP_SUMMARY"

      - name: Encrypt web symbols
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          WEB_SYMBOLS_ENCRYPTION_KEY: ${{ secrets.WEB_SYMBOLS_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          umask 077
          tar -czf "$RUNNER_TEMP/web-symbols.tgz" -C build/web main.dart.js main.dart.js.map version.json
          node tool/web_symbols.mjs seal "$RUNNER_TEMP/web-symbols.tgz" "$RUNNER_TEMP/web-symbols-v1.tgz.enc"

      - name: Retain encrypted web symbols
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: cloudboard-web-symbols-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/web-symbols-v1.tgz.enc
          if-no-files-found: error
          retention-days: 90

      - name: Remove source maps from public bundle
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import re
          for path in Path('build/web').rglob('*.map'):
              path.unlink()
          for path in Path('build/web').rglob('*.js'):
              path.write_text(re.sub(r'(?m)^//# sourceMappingURL=.*$', '', path.read_text()))
          PYTHON

      - name: Deploy to Firebase Hosting
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CLOUD_BOARD_STATIOND }}'
          channelId: live
          projectId: cloud-board-stationd
