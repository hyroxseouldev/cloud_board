name: Upload Android and TV to Google Play

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      upload_to_play:
        description: Upload to internal testing (disable to build an AAB without publishing)
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: google-play-main
  cancel-in-progress: false

jobs:
  class_start_regressions:
    uses: ./.github/workflows/class-start-regressions.yml

  backend_ready:
    name: Wait for verified backend deployment
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.upload_to_play) ||
      (github.event_name == 'push' && vars.GOOGLE_PLAY_BOOTSTRAPPED == 'true' &&
      !contains(github.event.head_commit.message, '[skip google-play]') &&
      !contains(github.event.head_commit.message, '[backend only]'))
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require this commit's tested and deployed Firebase rules
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tool/release_backend_gate.mjs

  upload:
    needs: [backend_ready, class_start_regressions]
    name: Build and upload to internal testing
    if: >-
      always() && !cancelled() && needs.class_start_regressions.result == 'success' &&
      (needs.backend_ready.result == 'success' ||
      (github.event_name == 'workflow_dispatch' && !inputs.upload_to_play))
    permissions:
      contents: write # Append-only versionCode reservation tags; never update/delete them.
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: google-play
    env:
      ANDROID_PACKAGE_NAME: com.sunmkim.cloudboard
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Require a trusted release source
        run: |
          case "$GITHUB_REF" in
            refs/heads/main|refs/heads/release/*) ;;
            *) echo 'Signed builds require main or a release/* branch.' >&2; exit 1 ;;
          esac

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Check Android signing credentials
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          required=(
            ANDROID_UPLOAD_KEYSTORE_BASE64
            ANDROID_KEY_ALIAS
            ANDROID_KEY_PASSWORD
            ANDROID_KEYSTORE_PASSWORD
          )

          missing=()
          for variable in "${required[@]}"; do
            if [[ -z "${!variable:-}" ]]; then
              missing+=("$variable")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "Missing Android signing environment secrets: ${missing[*]}" >&2
            exit 1
          fi

      - name: Check Play inventory and upload credential
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [[ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]]; then
            echo 'Missing Google Play secret: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON' >&2
            exit 1
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Require TV recovery regressions without missing or skipped cases
        run: |
          node --test tool/tv-recovery-check.test.mjs
          node tool/tv-recovery-check.mjs

      - name: Retain TV recovery regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv-recovery-android-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/sta176/
          if-no-files-found: error
          retention-days: 30

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Install Android upload key
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          keystore_path="$RUNNER_TEMP/cloudboard-upload.jks"
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          echo "ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Test release metadata and artifact gates
        run: |
          node --test tool/release/*.test.mjs
          python3 -m unittest discover -s tool/release -p 'test_*.py'

      - name: Derive marketing version and reserve a unique Play build number
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          node tool/release/play_version_code.mjs --version-name
          node tool/release/play_version_code.mjs --reserve "$RUNNER_TEMP/play-build-reservation.json"

      - name: Build signed Android App Bundle
        run: |
          set -euo pipefail

          flutter build appbundle --flavor production \
            --release \
            --dart-define=FIREBASE_ENV=production \
            --build-name "$RELEASE_VERSION_NAME" \
            --build-number "$PLAY_BUILD_NUMBER"

          bundle_path="build/app/outputs/bundle/productionRelease/app-production-release.aab"
          if [[ ! -f "$bundle_path" ]]; then
            echo 'The signed Android App Bundle was not created.' >&2
            exit 1
          fi

      - name: Verify actual AAB version, package and native/Dart Firebase binding
        run: |
          set -euo pipefail
          bundletool="$RUNNER_TEMP/bundletool-1.18.3.jar"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar \
            --output "$bundletool"
          python3 tool/release/inspect_native.py android \
            build/app/outputs/bundle/productionRelease/app-production-release.aab \
            --version "$RELEASE_VERSION_NAME" --build "$PLAY_BUILD_NUMBER" \
            --bundletool "$bundletool" --output "$RUNNER_TEMP/android-release-metadata.json"

      - name: Keep Android release evidence
        uses: actions/upload-artifact@v4
        with:
          name: cloudboard-android-release-evidence-${{ env.PLAY_BUILD_NUMBER }}
          path: |
            ${{ runner.temp }}/play-build-reservation.json
            ${{ runner.temp }}/android-release-metadata.json
          if-no-files-found: error
          retention-days: 90

      - name: Keep signed bundle for first upload and diagnosis
        uses: actions/upload-artifact@v4
        with:
          name: cloudboard-internal-aab-${{ env.PLAY_BUILD_NUMBER }}
          path: build/app/outputs/bundle/productionRelease/app-production-release.aab
          if-no-files-found: error
          retention-days: 14

      # Keep automatic releases on internal testing while the first production
      # release is in review. Do not resubmit Alpha or production changes.
      - name: Recheck backend before publishing
        if: vars.GOOGLE_PLAY_BOOTSTRAPPED == 'true' && (github.event_name == 'push' || inputs.upload_to_play)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          node tool/release_backend_gate.mjs --check-only
          node tool/release/play_version_code.mjs --recheck "$RUNNER_TEMP/play-build-reservation.json"

      - name: Upload mobile and TV bundle to internal testing
        if: >-
          vars.GOOGLE_PLAY_BOOTSTRAPPED == 'true' &&
          (github.event_name == 'push' || inputs.upload_to_play)
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.ANDROID_PACKAGE_NAME }}
          releaseFiles: build/app/outputs/bundle/productionRelease/app-production-release.aab
          track: internal
          status: completed
          # Google rejects changesNotSentForReview=true for this internal track.
          # Internal releases use the default commit behavior; no other track is edited.
          releaseName: "${{ env.RELEASE_VERSION_NAME }} (${{ env.PLAY_BUILD_NUMBER }}) - Internal"
