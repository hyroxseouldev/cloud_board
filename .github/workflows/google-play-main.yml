name: Upload Android and TV to Google Play

# One-time, owner-authorized mobile-first upload of the already signed 1.2.1 AAB.
# This branch is not merged into main/develop. It does not claim backend success.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: google-play-main
  cancel-in-progress: false

jobs:
  upload:
    name: Upload verified existing Android and TV artifact
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: google-play
    env:
      ANDROID_PACKAGE_NAME: com.sunmkim.cloudboard
    steps:
      - name: Checkout one-time uploader branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the approved one-time release branch
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != 'refs/heads/hyroxseouldev/release121-mobile-first' ]]; then
            echo 'This uploader is restricted to the approved one-time release branch.' >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify and download the signed main artifact and mobile-first evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tool/release/mobile_first_artifact.py android

      - name: Retain verified native metadata and owner approval
        if: always() && env.NATIVE_AUDIT_PATH != ''
        uses: actions/upload-artifact@v4
        with:
          name: cloudboard-android-mobile-first-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.NATIVE_METADATA_PATH }}
            ${{ env.PLAY_RESERVATION_PATH }}
            ${{ env.NATIVE_AUDIT_PATH }}
          if-no-files-found: error
          retention-days: 90

      - name: Recheck the original Play reservation and current upload history
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [[ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]]; then
            echo 'Missing Google Play secret: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON' >&2
            exit 1
          fi
          # The reservation is bound to the downloaded main artifact, not the
          # uploader workflow commit. The audit records both exact source SHAs.
          GITHUB_SHA=5976180f306f561b85bb88ce419070198dfc2669 \
            node tool/release/play_version_code.mjs --recheck "$PLAY_RESERVATION_PATH"

      - name: Upload mobile and TV bundle to internal testing
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.ANDROID_PACKAGE_NAME }}
          releaseFiles: ${{ env.NATIVE_ARTIFACT_PATH }}
          track: internal
          status: completed
          # Preserve the existing internal-track commit policy. No Alpha or
          # production track is edited; changesNotSentForReview remains unset.
          releaseName: "${{ env.RELEASE_VERSION_NAME }} (${{ env.NATIVE_BUILD_NUMBER }}) - Internal"
