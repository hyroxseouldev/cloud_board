<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CloudBoard · 에어비엔비 스타일</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f7f7;color:#222;font-family:system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif}header{padding:32px 4vw;background:white;border-bottom:1px solid #ebebeb}h1{font-size:30px;letter-spacing:-1px;margin:12px 0}.eyebrow{font-size:12px;font-weight:700;letter-spacing:2px;color:#ff385c}p{line-height:1.6;color:#6a6a6a}a{color:inherit}button,select{font:inherit;min-height:44px;border:1px solid #ddd;border-radius:8px;padding:8px 14px;background:white;color:#222;cursor:pointer}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #ff385c;outline-offset:3px}.toolbar{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:24px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px;padding:28px 4vw}.tile{background:white;border:1px solid #ebebeb;border-radius:12px;overflow:hidden}.thumb{display:block;width:100%;height:480px;padding:16px;border:0;border-radius:0;background:#eee}.thumb:hover{background:#e6e6e6}.thumb img{width:100%;height:100%;object-fit:contain;display:block}.meta{padding:16px 20px}.meta h2{font-size:17px;margin:0}.meta span{color:#ff385c;margin-right:8px}.meta a{font-size:13px;display:inline-block;margin-top:10px}.viewer{position:fixed;inset:0;width:100vw;height:100dvh;max-width:none;max-height:none;margin:0;padding:0;background:#171717;color:white;border:0}.viewer::backdrop{background:#171717}.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 20px;min-height:72px;border-bottom:1px solid #444}.bar h2{font-size:16px;flex:1;margin:0}.bar button{background:#292929;border-color:#555;color:white}.canvas{height:calc(100dvh - 72px);overflow:auto;text-align:center;padding:16px}.canvas img{max-width:100%;max-height:100%;object-fit:contain}.canvas.zoom img{max-height:none;max-width:none;width:auto}footer{padding:12px 4vw 32px;color:#6a6a6a;font-size:13px}body.list main{display:flex;flex-direction:column;max-width:1000px;margin:auto}body.list .thumb{height:auto;max-height:none}body.list .thumb img{height:auto;max-height:850px}dialog a{color:white}@media(max-width:600px){header{padding:24px 20px}h1{font-size:24px}main{padding:20px;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.thumb{height:310px;padding:6px}.meta{padding:12px}.meta h2{font-size:14px}.bar h2{flex-basis:100%}.canvas{height:calc(100dvh - 112px)}}
</style>
<header><div class="eyebrow">CLOUDBOARD / DESIGN STUDY / STA-38</div><h1>에어비엔비 스타일 · 전체 12페이지</h1><p>흰 배경, 또렷한 검정, 작은 코랄 포인트. STA-36의 화면 범위를 기준으로 만든 디자인 검토용 이미지입니다.</p><div class="toolbar"><label>보기 <select id="layout"><option value="grid">한눈에 보기</option><option value="list">세로로 나열</option></select></label><span>이미지를 누르면 확대 · ← → 이동 · Esc 닫기</span><a href="https://linear.app/clyrdev/issue/STA-38">Linear 이슈</a><a href="cloudboard-airbnb-redesign.pdf">12페이지 PDF</a></div></header>
<main id="gallery"></main><footer>Built-in ImageGen · 2026-09-25 · 모바일 11장 + TV 1장 · 실제 앱 구현이나 실행 캡처가 아닙니다. 화면 속 데이터와 타이머 비율은 예시입니다.</footer>
<dialog class="viewer" id="viewer" aria-labelledby="viewer-title"><div class="bar"><h2 id="viewer-title"></h2><button id="prev" aria-label="이전 시안">←</button><button id="next" aria-label="다음 시안">→</button><button id="zoom" aria-pressed="false">원본 확대</button><a id="download" download>원본 저장</a><button id="close">닫기</button></div><div class="canvas" id="canvas"><img id="large" alt=""></div></dialog>
<script>
const pages=[{"id":"01","title":"로그인","file":"01-login.png"},{"id":"02","title":"홈","file":"02-home.png"},{"id":"03","title":"워크아웃 편집","file":"03-workout-editor.png"},{"id":"04","title":"슬라이드 편집","file":"04-slide-editor.png"},{"id":"05","title":"디스플레이 관리","file":"05-displays.png"},{"id":"06","title":"프로필","file":"06-profile.png"},{"id":"07","title":"온보딩","file":"07-onboarding.png"},{"id":"08","title":"즐겨찾기","file":"08-favorites.png"},{"id":"09","title":"매장 운영","file":"09-operations.png"},{"id":"10","title":"대기 화면 설정","file":"10-standby.png"},{"id":"11","title":"수업 진행","file":"11-player.png"},{"id":"12","title":"TV 송출","file":"12-tv-display.png"}];
const gallery=document.querySelector('#gallery'),viewer=document.querySelector('#viewer'),large=document.querySelector('#large'),canvas=document.querySelector('#canvas');let current=0,opener;
function show(i){current=(i+pages.length)%pages.length;const p=pages[current];large.src=p.file;large.alt=p.title+' 시안';document.querySelector('#viewer-title').textContent=p.id+' / 12 · '+p.title;document.querySelector('#download').href=p.file;document.querySelector('#download').download=p.file;canvas.classList.remove('zoom');document.querySelector('#zoom').setAttribute('aria-pressed','false');document.querySelector('#zoom').textContent='원본 확대';canvas.scrollTo(0,0)}
pages.forEach((p,i)=>{const tile=document.createElement('article');tile.className='tile';const button=document.createElement('button');button.className='thumb';button.setAttribute('aria-label',p.title+' 시안 크게 보기');const img=document.createElement('img');img.src=p.file;img.alt=p.title+' 에어비엔비 스타일';img.loading='lazy';button.append(img);button.onclick=()=>{opener=button;show(i);viewer.showModal()};const meta=document.createElement('div');meta.className='meta';const h=document.createElement('h2');h.innerHTML='<span>'+p.id+'</span>'+p.title;const link=document.createElement('a');link.href=p.file;link.download=p.file;link.textContent='원본 저장';meta.append(h,link);tile.append(button,meta);gallery.append(tile)});
document.querySelector('#prev').onclick=()=>show(current-1);document.querySelector('#next').onclick=()=>show(current+1);document.querySelector('#close').onclick=()=>viewer.close();viewer.addEventListener('close',()=>opener?.focus());document.querySelector('#zoom').onclick=()=>{const on=canvas.classList.toggle('zoom');document.querySelector('#zoom').setAttribute('aria-pressed',String(on));document.querySelector('#zoom').textContent=on?'화면에 맞춤':'원본 확대'};document.addEventListener('keydown',e=>{if(!viewer.open)return;if(e.key==='ArrowLeft'){e.preventDefault();show(current-1)}if(e.key==='ArrowRight'){e.preventDefault();show(current+1)}});document.querySelector('#layout').onchange=e=>document.body.classList.toggle('list',e.target.value==='list');
</script>
</html>
