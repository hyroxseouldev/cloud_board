name: Review development handoff

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: development-handoff-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  handoff:
    # Keep the existing required context; on PRs this checks the handoff only.
    # Production still requires the full firebase-required release aggregation.
    name: firebase-required
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          # The PR merge commit and its two parents cover this patch check.
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check patch whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --check "$BASE_SHA" HEAD
      - name: Check developer handoff for this revision
        run: node tool/development_handoff.mjs
      - name: Explain verification scope
        run: |
          echo 'PR handoff and patch checks passed. Application tests were NOT executed by this job.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Review the developer evidence in the PR. Main merges do not deploy. dev/vX.Y.Z-N tags start development deployment; vX.Y.Z tags start production release with required CI or an explicit audited manual skip.' >> "$GITHUB_STEP_SUMMARY"
