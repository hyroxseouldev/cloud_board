name: Required class start regressions
on:
  workflow_call:
permissions:
  contents: read
jobs:
  class_start:
    name: Class start lifecycle and TV preparation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Verify fail-closed regression runner and workflow dependencies
        run: node --test tool/class_start_regressions.test.mjs
      - name: Required native logic regressions
        run: node tool/class_start_regressions.mjs vm
      - name: Required web regressions
        run: node tool/class_start_regressions.mjs chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: class-start-${{ github.workflow }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/class-start/
          if-no-files-found: error
          retention-days: 30
