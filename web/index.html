<!DOCTYPE html>
<html lang="ko">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="theme-color" content="#F7F5EF">
  <link rel="stylesheet" href="startup_loading.css">
  <style>html, body { background-color: #F7F5EF; }</style>
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="cloud_board">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>cloud_board</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- This is the same bundled original asset used by SoftRhythmMark. -->
  <div id="app-startup" role="status" aria-label="앱 준비 중">
    <img class="startup-mark" src="assets/assets/branding/soft_rhythm_mark.png"
         width="128" height="128" alt="" aria-hidden="true">
    <div id="startup-error" hidden>
      <p>앱을 준비하지 못했습니다.<br>연결을 확인하고 다시 시도해 주세요.</p>
      <button id="startup-retry" type="button">다시 시도</button>
    </div>
  </div>
  <script src="startup_loading.js"></script>
  <script src="flutter_bootstrap.js" async
          onerror="window.appStartup?.fail()"></script>
</body>
</html>
